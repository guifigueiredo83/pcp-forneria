<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<title>PCP Forneria Sofia</title>
<meta name="description" content="Painel de chão de fábrica em tempo real da Forneria Sofia">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    --ground:#F1F3F1;--surface:#FFFFFF;--surface-2:#F6F8F6;--line:#DDE2DD;--line-strong:#C7CEC7;
    --ink:#1B2320;--ink-2:#4B554F;--ink-3:#79847D;
    --accent:#12798C;--accent-soft:#DCEEF1;--forno:#DD8A28;--forno-soft:#F8EBD3;
    --ok:#2F8B58;--ok-soft:#DBEEE2;--warn:#D9852A;--warn-soft:#F8EBD3;--crit:#C4463A;--crit-soft:#F6DFDC;
    --estoque:#5B6EC7;--estoque-soft:#E2E5F6;
    --shadow:0 1px 2px rgba(27,35,32,.06),0 6px 20px rgba(27,35,32,.06);--radius:14px;
    --fs-display:"Archivo",system-ui,sans-serif;--fs-body:"IBM Plex Sans",system-ui,sans-serif;--fs-mono:"IBM Plex Mono",ui-monospace,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --ground:#111513;--surface:#1A201D;--surface-2:#222A26;--line:#2E3833;--line-strong:#3C4741;
    --ink:#E8EDEA;--ink-2:#AEB8B2;--ink-3:#7C877F;--accent:#3FB0C4;--accent-soft:#123037;--forno:#E8A44E;--forno-soft:#3A2C15;
    --ok:#54B47E;--ok-soft:#173026;--warn:#E0A050;--warn-soft:#3A2C15;--crit:#E0685C;--crit-soft:#3A211E;
    --estoque:#8A9AE0;--estoque-soft:#1E2440;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }}
  :root[data-theme="dark"]{
    --ground:#111513;--surface:#1A201D;--surface-2:#222A26;--line:#2E3833;--line-strong:#3C4741;
    --ink:#E8EDEA;--ink-2:#AEB8B2;--ink-3:#7C877F;--accent:#3FB0C4;--accent-soft:#123037;--forno:#E8A44E;--forno-soft:#3A2C15;
    --ok:#54B47E;--ok-soft:#173026;--warn:#E0A050;--warn-soft:#3A2C15;--crit:#E0685C;--crit-soft:#3A211E;
    --estoque:#8A9AE0;--estoque-soft:#1E2440;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--fs-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:var(--fs-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
  button{font-family:inherit;font-size:inherit;cursor:pointer}
  .mono,.num{font-family:var(--fs-mono);font-variant-numeric:tabular-nums}
  .eyebrow{font-family:var(--fs-display);text-transform:uppercase;letter-spacing:.09em;font-size:11px;font-weight:700;color:var(--ink-3)}
  .app{max-width:1180px;margin:0 auto;padding:0 18px 60px}
  header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--ground) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin:0 -18px 20px;padding:12px 18px}
  .top-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:11px;min-width:0}
  .logo{width:38px;height:38px;border-radius:10px;background:var(--ink);color:var(--ground);display:grid;place-items:center;font-size:20px;flex:none}
  .brand h1{font-size:17px;font-weight:800;line-height:1.1}
  .brand p{margin:1px 0 0;font-size:11.5px;color:var(--ink-3);font-weight:600;letter-spacing:.02em}
  .spacer{flex:1}
  .status{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
  .dot.live{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
  .dot.demo{background:var(--warn);box-shadow:0 0 0 3px var(--warn-soft)}
  .perfil select{font-family:inherit;font-size:13px;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:9px;padding:7px 10px}
  .iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:9px;width:36px;height:36px;display:grid;place-items:center;color:var(--ink-2);font-size:16px}
  nav.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:12px;scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  .tab{border:none;background:transparent;color:var(--ink-2);font-weight:600;font-size:13.5px;padding:9px 14px;border-radius:9px;white-space:nowrap;display:flex;align-items:center;gap:7px}
  .tab .ti{font-size:15px}
  .tab.active{background:var(--ink);color:var(--ground)}
  .tab .badge{background:var(--crit);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px;font-family:var(--fs-mono)}
  .tab.active .badge{background:var(--ground);color:var(--ink)}
  .banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);border-radius:12px;padding:12px 15px;margin-bottom:18px;font-size:13.5px;color:var(--ink)}
  .banner .bspacer{flex:1}
  .btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:9px;padding:8px 14px;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;transition:transform .05s}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.forno{background:var(--forno);border-color:var(--forno);color:#3a2705}
  .btn.okb{background:var(--ok);border-color:var(--ok);color:#fff}
  .btn.ghost{background:transparent}
  .btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
  .btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 45%,var(--line))}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .grid{display:grid;gap:14px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .card-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .card-h h2{font-size:14.5px;font-weight:700}
  .card-b{padding:14px 16px}
  .pad0 .card-b{padding:0}
  .sec-title{display:flex;align-items:center;gap:12px;margin:2px 0 14px;flex-wrap:wrap}
  .sec-title h2{font-size:20px;font-weight:800}
  .sec-title p{margin:0;color:var(--ink-3);font-size:13px}
  .tw{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{font-family:var(--fs-display);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:700;white-space:nowrap}
  td.n,th.n{text-align:right;font-family:var(--fs-mono);font-variant-numeric:tabular-nums}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--surface-2)}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;font-family:var(--fs-display);letter-spacing:.02em;white-space:nowrap}
  .pill.ok{background:var(--ok-soft);color:var(--ok)}
  .pill.warn{background:var(--warn-soft);color:var(--warn)}
  .pill.crit{background:var(--crit-soft);color:var(--crit)}
  .pill.accent{background:var(--accent-soft);color:var(--accent)}
  .pill.forno{background:var(--forno-soft);color:var(--forno)}
  .pill.estoque{background:var(--estoque-soft);color:var(--estoque)}
  .pill.mut{background:var(--surface-2);color:var(--ink-3)}
  .stripe{width:4px;align-self:stretch;border-radius:3px;flex:none}
  .bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;min-width:70px}
  .bar > i{display:block;height:100%;border-radius:99px;background:var(--ok)}
  .bar > i.part{background:var(--forno)}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .tile .k{font-size:12px;color:var(--ink-3);font-weight:600;display:flex;align-items:center;gap:6px}
  .tile .v{font-family:var(--fs-display);font-weight:800;font-size:30px;line-height:1.05;margin-top:8px;font-variant-numeric:tabular-nums}
  .tile .sub{font-size:12px;color:var(--ink-2);margin-top:4px}
  .tile.accent-t{background:linear-gradient(180deg,var(--accent-soft),var(--surface))}
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font-size:12px;font-weight:600;color:var(--ink-2)}
  .field input,.field select,.field textarea{font-family:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:9px;padding:9px 11px;width:100%}
  .field textarea{resize:vertical;min-height:64px}
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .empty{padding:34px 16px;text-align:center;color:var(--ink-3);font-size:13.5px}
  .muted{color:var(--ink-3)}
  .right{margin-left:auto}
  .rowflex{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  /* sub-nav (dias / filtros) */
  .subnav{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;scrollbar-width:none;padding-bottom:2px}
  .subnav::-webkit-scrollbar{display:none}
  .chip{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2);font-weight:600;font-size:13px;padding:7px 13px;border-radius:999px;white-space:nowrap;display:inline-flex;gap:7px;align-items:center}
  .chip.active{background:var(--ink);color:var(--ground);border-color:var(--ink)}
  .chip .cbadge{font-family:var(--fs-mono);font-size:11px;opacity:.8}
  .chip.today{border-color:var(--accent);color:var(--accent)}
  .chip.today.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .daychips{display:flex;gap:5px;flex-wrap:wrap}
  .daychip{font-family:var(--fs-mono);font-size:11px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:2px 7px;color:var(--ink-2)}
  /* dias-grid no formulário */
  .diasgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
  .diasgrid .d{display:flex;flex-direction:column;gap:4px;align-items:center}
  .diasgrid .d span{font-size:11px;font-weight:700;color:var(--ink-2);font-family:var(--fs-display)}
  .diasgrid .d input{text-align:center;padding:8px 4px;font-family:var(--fs-mono)}
  .diasgrid .d.on span{color:var(--accent)}
  .diasgrid .d.on input{border-color:var(--accent)}
  @media(max-width:560px){.diasgrid{grid-template-columns:repeat(4,1fr)}}
  /* config editor */
  .cfg-rota{display:flex;gap:6px;flex-wrap:wrap}
  .cfg-et{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);border-radius:9px;padding:6px 11px;font-size:13px;font-weight:600;cursor:pointer;user-select:none}
  .cfg-et.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .co-row{display:grid;grid-template-columns:1.4fr .7fr 1.6fr auto;gap:8px;align-items:end;margin-bottom:8px}
  @media(max-width:640px){.co-row{grid-template-columns:1fr 1fr}}
  .scrim{position:fixed;inset:0;background:rgba(10,14,12,.5);display:grid;place-items:center;z-index:50;padding:16px}
  .modal{background:var(--surface);border:1px solid var(--line-strong);border-radius:16px;width:min(560px,100%);max-height:92vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.3)}
  .modal-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
  .modal-h h3{font-size:16px;font-weight:800}
  .modal-b{padding:18px}
  .modal-f{display:flex;gap:10px;padding:14px 18px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
  .infobox{background:var(--forno-soft);border:1px solid color-mix(in srgb,var(--forno) 35%,transparent);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:12px}
  /* painel */
  .painel-hero{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
  .painel-hero .clock{font-family:var(--fs-mono);font-weight:600;font-size:15px;color:var(--ink-2)}
  .painel-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
  .live-row{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line)}
  .live-row:last-child{border-bottom:none}
  .live-row .who{font-size:12px;color:var(--ink-3)}
  .live-row .main{font-weight:600;min-width:0;flex:1}
  .prog-row{padding:12px 16px;border-bottom:1px solid var(--line)}
  .prog-row:last-child{border-bottom:none}
  .prog-top{display:flex;align-items:baseline;gap:8px;margin-bottom:7px}
  .prog-top .p-name{font-weight:600}
  .prog-top .p-val{margin-left:auto;font-family:var(--fs-mono);font-size:13px}
  .gargalo-card{background:linear-gradient(160deg,var(--accent-soft),var(--surface))}
  .gargalo-state{font-family:var(--fs-display);font-weight:800;font-size:22px;display:flex;align-items:center;gap:10px}
  body.tv .app{max-width:100%;padding:0}
  body.tv header.top,body.tv nav.tabs,body.tv .banner{display:none}
  .tvwrap{display:none}
  body.tv .tvwrap{display:block;padding:26px 30px;min-height:100vh}
  body.tv .painel-hero .clock{font-size:22px}
  body.tv h1.tvttl{font-size:30px}
  body.tv .tile .v{font-size:42px}
  body.tv .prog-top,body.tv .live-row .main{font-size:19px}
  body.tv .prog-top .p-val{font-size:17px}
  body.tv .gargalo-state{font-size:30px}
  .tv-exit{position:fixed;top:14px;right:14px;z-index:60}
  /* kanban */
  .kbwrap{overflow-x:auto;padding-bottom:10px;margin:0 -2px}
  .kb{display:flex;gap:12px;align-items:flex-start;min-width:min-content}
  .kb-col{flex:0 0 250px;max-width:250px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column}
  .kb-col.done{background:color-mix(in srgb,var(--ok-soft) 50%,var(--surface-2))}
  .kb-col-h{padding:10px 12px;font-family:var(--fs-display);font-weight:700;font-size:12.5px;display:flex;align-items:center;gap:7px;border-bottom:1px solid var(--line)}
  .kb-col-h .cnt{margin-left:auto;font-family:var(--fs-mono);font-size:11px;color:var(--ink-3);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
  .kb-col-b{padding:10px;display:flex;flex-direction:column;gap:9px;min-height:50px}
  .kb-card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--ink-3);border-radius:10px;padding:10px 11px;box-shadow:var(--shadow)}
  .kb-card.urg{border-left-color:var(--crit)}
  .kb-card.gargalo{border-left-color:var(--accent)}
  .kb-card.doing{border-left-color:var(--forno)}
  .kb-card .t{font-weight:700;font-size:14px;line-height:1.25}
  .kb-card .m{font-size:12px;color:var(--ink-2);margin-top:3px}
  .kb-card .m .mono{font-size:11.5px}
  .kb-card .act{margin-top:9px;display:flex;gap:6px;flex-wrap:wrap}
  .kb-card .act .btn{flex:1;justify-content:center}
  .kb-empty{color:var(--ink-3);font-size:12px;text-align:center;padding:14px 4px}
  body.tv .kb-col{flex-basis:300px;max-width:300px}
  body.tv .kb-card .t{font-size:17px}
  body.tv .kb-card .act{display:none}
  @media(max-width:820px){.painel-grid{grid-template-columns:1fr}}
  @media(max-width:560px){.brand p{display:none}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<style>
#login-screen{position:fixed;inset:0;z-index:100;background:var(--ground);display:flex;align-items:center;justify-content:center;padding:20px}
#login-screen .login-box{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:30px 26px;width:100%;max-width:360px}
#login-screen .login-logo{display:flex;align-items:center;gap:12px;margin-bottom:22px}
#login-screen .login-logo .logo{width:44px;height:44px;border-radius:12px;background:var(--ink);color:var(--ground);display:grid;place-items:center;font-size:22px}
#login-screen .login-logo h1{font-size:18px;font-weight:800;font-family:var(--fs-display)}
#login-screen .login-logo span{font-size:11px;color:var(--ink-3);display:block;margin-top:2px;font-weight:600}
</style>
<div id="login-screen">
  <form class="login-box" onsubmit="entrar();return false">
    <div class="login-logo"><div class="logo">🥖</div><div><h1>Forneria Sofia</h1><span>PCP · Chão de fábrica</span></div></div>
    <div class="field"><label>Usuário</label><input id="l-user" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="seu nome"></div>
    <div class="field" style="margin-top:12px"><label>Senha</label><input id="l-pass" type="password" autocomplete="current-password" placeholder="senha"></div>
    <button class="btn primary" id="login-btn" type="submit" style="width:100%;justify-content:center;margin-top:18px;padding:12px">Entrar</button>
    <div id="login-error" style="color:var(--crit);font-size:12.5px;text-align:center;margin-top:10px;min-height:16px"></div>
    <div style="font-size:12px;color:var(--ink-3);text-align:center;margin-top:14px;line-height:1.5">Primeiro acesso? Use seu nome como senha.<br>Ex.: usuário <b>flavia</b> → senha <b>flavia</b></div>
  </form>
</div>
<div class="app">
  <header class="top">
    <div class="top-row">
      <div class="brand">
        <div class="logo">🥖</div>
        <div><h1>Forneria Sofia</h1><p id="brandsub">PCP · Chão de fábrica em tempo real</p></div>
      </div>
      <div class="spacer"></div>
      <div class="status" id="status"><span class="dot" id="statusDot"></span><span id="statusTxt">conectando…</span></div>
      <div class="perfil"><select id="perfilSel" aria-label="Perfil"></select></div>
      <button class="iconbtn" id="themeBtn" title="Tema claro/escuro" aria-label="Alternar tema">◐</button>
      <button class="iconbtn" id="pwBtn" title="Trocar senha" aria-label="Trocar senha" onclick="trocarSenha()">🔑</button>
      <button class="iconbtn" id="outBtn" title="Sair da conta" aria-label="Sair" onclick="sairConta()">⎋</button>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <div id="banner"></div>
  <main id="view"></main>
</div>
<div class="tvwrap" id="tvwrap"></div>
<button class="btn ghost tv-exit" id="tvExit" style="display:none">✕ Sair do modo TV</button>
<div id="modalHost"></div>

<script>
/* ===== Firebase + login (GitHub Pages / Firestore) ===== */
var firebaseConfig={apiKey:"AIzaSyBQJDNLzwO5v9DfbDjVfAH1gKhaA9jjLZQ",authDomain:"controle-de-estoque-congelado.firebaseapp.com",projectId:"controle-de-estoque-congelado",storageBucket:"controle-de-estoque-congelado.firebasestorage.app",messagingSenderId:"796926926929",appId:"1:796926926929:web:e29c720c94492d0d54d870"};
firebase.initializeApp(firebaseConfig);
const FS=firebase.firestore();
const FBCOL=n=>"pcp_"+n;                       // coleções do PCP no mesmo projeto do estoque-frio
const USUARIOS_VALIDOS=["flavia","erik","elivelton","matheus","guilherme","iriane"];
function hashSimples(str){var h=0;for(var i=0;i<str.length;i++){h=((h<<5)-h)+str.charCodeAt(i);h=h&h;}return h.toString();}
let usuarioLogado=null;

/* ============================================================

// compõe a batida de massa a partir dos lotes padrão do produto para cobrir uma quantidade-alvo
// escolhe a combinação de lotes com o MENOR excedente acima da meta (e, em empate, menos batidas)
function sugerirBatches(pid,alvo){
  const lotes=((cfgOf(pid)||{}).loteMassas||[]).map(x=>({masseira:x.masseira,qtd:Number(x.qtd||0)})).filter(x=>x.qtd>0).sort((a,b)=>b.qtd-a.qtd);
  if(!lotes.length)return null;
  alvo=Math.max(0,Number(alvo||0));
  if(alvo<=0)return {itens:[],total:0,temLotes:true};
  const sizes=[...new Set(lotes.map(l=>l.qtd))];
  const maxLot=Math.max(...sizes);
  const LIM=alvo+maxLot; // o menor total >= alvo sempre cabe nesta janela
  const dp=new Array(LIM+1).fill(null);dp[0]=0; // dp[t] = menor nº de batidas para somar exatamente t
  for(let t=1;t<=LIM;t++){for(const s of sizes){if(t-s>=0&&dp[t-s]!=null&&(dp[t]==null||dp[t-s]+1<dp[t]))dp[t]=dp[t-s]+1;}}
  let best=null;for(let t=alvo;t<=LIM;t++){if(dp[t]!=null){best=t;break;}}
  if(best==null){ // salvaguarda: múltiplo do menor lote
    const menor=Math.min(...sizes);const n=Math.ceil(alvo/menor);
    const m=lotes.find(l=>l.qtd===menor);
    return {itens:[{masseira:m.masseira,qtd:menor,n}],total:menor*n,temLotes:true};
  }
  // reconstrói a composição a partir do dp
  const plan=[];let t=best;
  while(t>0){for(const s of sizes){if(t-s>=0&&dp[t-s]!=null&&dp[t-s]+1===dp[t]){plan.push(s);t-=s;break;}}}
  const sizeToM={};lotes.forEach(l=>{if(!(l.qtd in sizeToM))sizeToM[l.qtd]=l.masseira;});
  const map={};plan.forEach(s=>{(map[s]=map[s]||{masseira:sizeToM[s],qtd:s,n:0}).n++;});
  return {itens:Object.values(map).sort((a,b)=>b.qtd-a.qtd),total:plan.reduce((a,b)=>a+b,0),temLotes:true};
}
function fmtBatches(res){if(!res||!res.itens||!res.itens.length)return"";return res.itens.map(i=>`${i.n>1?i.n+"× ":""}${esc(i.masseira)} (${fmt(i.qtd)})`).join(" + ")+` = ${fmt(res.total)}`;}

async function initDB(){
  setStatus("connecting");DB=FS;
  if(!DB){MODE="demo";loadDemo();setStatus("demo");renderAll();return;}
  try{const s=await DB.collection(FBCOL("catalogo")).limit(1).get();
    if(s.empty){MODE="demo";loadDemo();setStatus("demo");renderAll();}
    else{MODE="live";subscribeAll();setStatus("live");}
  }catch(e){MODE="demo";loadDemo();setStatus("demo");renderAll();toast("Erro de conexão: "+(e&&e.message||e));}
}
function loadDemo(){
  cache.catalogo=CATALOGO_SEED.map(x=>({...x}));
  cache.config=CONFIG_SEED.map(x=>({...x}));
  cache.plano=PLANO_SEED.map(x=>({...x}));
  cache.pedidos=PEDIDOS_SEED.map(x=>({...x}));
  cache.apont=APONT_SEED.map(x=>({...x}));
}
function subscribeAll(){
  unsub.forEach(u=>{try{u()}catch(e){}});unsub=[];
  const sig={};
  const wire=(col,key)=>{const u=DB.collection(FBCOL(col)).onSnapshot(snap=>{
    const arr=snap.docs.map(d=>({id:d.id,...d.data()}));
    const s=JSON.stringify(arr);
    if(sig[key]===s)return;            // nada mudou de verdade → não re-renderiza (evita churn que "mata" os botões)
    sig[key]=s;cache[key]=arr;scheduleRender();
  },err=>{});unsub.push(u);};
  wire("catalogo","catalogo");wire("config","config");wire("plano","plano");wire("pedidos","pedidos");wire("apontamentos","apont");
}
async function seedDB(){
  if(!DB)return;const btn=$("#seedBtn");if(btn){btn.disabled=true;btn.textContent="Inicializando…";}
  try{
    for(const c of CATALOGO_SEED) await DB.collection(FBCOL("catalogo")).doc(c.id).set(c);
    for(const c of CONFIG_SEED)   await DB.collection(FBCOL("config")).doc(c.id).set(c);
    for(const p of PLANO_SEED)    await DB.collection(FBCOL("plano")).doc(p.id).set(p);
    for(const p of PEDIDOS_SEED)  await DB.collection(FBCOL("pedidos")).doc(p.id).set(p);
    for(const a of APONT_SEED)    await DB.collection(FBCOL("apontamentos")).doc(a.id).set(a);
    MODE="live";subscribeAll();setStatus("live");
  }catch(e){toast("Não consegui inicializar: "+(e&&e.message||e));if(btn){btn.disabled=false;btn.textContent="Inicializar sistema";}}
}
function resetBase(){
  confirmar("Reiniciar a base? Isso apaga TODOS os apontamentos, pedidos, configurações e o plano atual, e recarrega o catálogo com as quantidades semanais padrão.",async()=>{
    cfgProd=null;
    if(MODE==="live"&&DB){
      for(const c of ["apontamentos","pedidos","plano","config","catalogo"]){
        const snap=await DB.collection(FBCOL(c)).get();
        for(const d of snap.docs) await DB.collection(FBCOL(c)).doc(d.id).delete();
      }
      await seedDB();
    } else { loadDemo(); renderAll(); }
    toast("Base reiniciada.");
  },"Reiniciar base");
}
const colKey=c=>({catalogo:"catalogo",config:"config",plano:"plano",pedidos:"pedidos",apontamentos:"apont"}[c]);
async function put(col,id,data){
  // otimista: atualiza a memória e re-renderiza já; grava no banco em seguida (com erro visível)
  const a=cache[colKey(col)];const i=a.findIndex(x=>x.id===id);if(i>=0)a[i]={...a[i],...data,id};else a.push({...data,id});renderAll();
  if(MODE==="live"&&DB){try{await DB.collection(FBCOL(col)).doc(id).set({...data,id});}catch(e){toast("Erro ao salvar: "+(e&&e.message||e));}}
}
async function patch(col,id,data){
  // patch = set do documento inteiro (merge na memória), evitando o "update exige doc existente"
  const a=cache[colKey(col)];const i=a.findIndex(x=>x.id===id);const merged=i>=0?{...a[i],...data,id}:{...data,id};
  if(i>=0){a[i]=merged;}else{a.push(merged);}renderAll();
  if(MODE==="live"&&DB){try{await DB.collection(FBCOL(col)).doc(id).set(merged);}catch(e){toast("Erro ao salvar: "+(e&&e.message||e));}}
}
async function del(col,id){
  const k=colKey(col);cache[k]=cache[k].filter(x=>x.id!==id);renderAll();
  if(MODE==="live"&&DB){try{await DB.collection(FBCOL(col)).doc(id).delete();}catch(e){toast("Erro ao excluir: "+(e&&e.message||e));}}
}

/* ---------- métricas ---------- */
function realizadoProduto(id){
  // produzido para estoque = quantidade concluída na ETAPA FINAL de estoque (Ultracongelamento),
  // somada entre os dias. Não somar todas as etapas (evita contar o mesmo lote várias vezes).
  return cache.apont.filter(a=>a.produto===id&&!a.pedidoId&&a.etapa===GARGALO&&a.status==="concluido")
    .reduce((s,a)=>s+Number(a.qtd||0),0);
}
function metricasEtapa(){
  return ETAPAS.map(et=>{
    const aps=cache.apont.filter(a=>a.etapa===et);const conc=aps.filter(a=>a.status==="concluido");
    const t=conc.map(a=>durMin(a.inicio,a.fim)).filter(x=>x!=null);
    const tMed=t.length?Math.round(t.reduce((s,x)=>s+x,0)/t.length):null;

    const perdaP=aps.reduce((s,a)=>s+Number(a.perdaProd||0),0);
    const perdaM=aps.reduce((s,a)=>s+Number(a.perdaMP||0),0);
    const pct=prodTot>0?(perdaP/(prodTot+perdaP))*100:(perdaP>0?100:0);
    return{etapa:et,n:aps.length,tMed,prodTot,perdaP,perdaM,pct,andamento:aps.filter(a=>a.status==="andamento").length};
  });

  if(aps.some(a=>a.status==="andamento"))return"andamento";if(aps.some(a=>a.status==="concluido"))return"concluido";return"afazer";}

function progressoTarefa(t){const aps=cache.apont.filter(a=>a.produto===t.produto&&a.etapa===t.etapa&&(t.origem==="pedido"?a.pedidoId===t.refId:(!a.pedidoId&&(t.dia?a.diaProg===t.dia:true))));

  if(target>0&&produced>=target)st="concluido";

  kbHero(w,"Quadro de Pedidos","Pedidos dos clientes (independe da semana)","kped",tv,'<button class="btn primary sm" id="novoPed">+ Novo pedido</button>');
  if(!tv){const nb=w.querySelector("#novoPed");if(nb)nb.onclick=()=>modalPedido();}
  const ativos=cache.pedidos.filter(p=>p.status!=="nao");
  if(!ativos.length){const c=el("div","card");c.appendChild(el("div","empty","Nenhum pedido ativo. Use “+ Novo pedido” para lançar um. (Recusados aparecem nas Métricas.)"));w.appendChild(c);return w;}
  const cols=[{key:"A atender",nome:"A atender",icon:"📥"}].concat(ETAPAS_PEDIDO.map(e=>({key:e,nome:e,icon:ETAPA_ICON[e]}))).concat([{key:"Entregue",nome:"Entregue",icon:"✅",done:true}]);
  const porCol={};cols.forEach(c=>porCol[c.key]=[]);
  ativos.forEach(pd=>{
    if(pd.status==="aberto"){porCol["A atender"].push(pd);return;}
    if(pd.status==="entregue"){porCol["Entregue"].push(pd);return;}
    const at=etapaAtual(pd.produto,ETAPAS_PEDIDO,{pedidoId:pd.id});porCol[at||"Entregue"].push(pd);
  });
  w.appendChild(kbBoard(cols,porCol,(pd,c)=>kcardPed(pd,c.key,tv)));
  return w;
}
function kcardPed(pd,col,tv){
  const P=prod(pd.produto);const isAtender=col==="A atender",isEntregue=col==="Entregue";
  const doing=!isAtender&&!isEntregue&&stApont(pd.produto,col,{pedidoId:pd.id})==="andamento";
  const card=el("div","kb-card"+(pd.urgente&&pd.status==="aberto"?" urg":"")+(doing?" doing":""));
  let body=`<div class="t">${esc(pd.cliente)}</div><div class="m">${fmt(pd.qtd)} ${esc(P.un)} · ${esc(P.nome)}</div>`;
  if(pd.spec)body+=`<div class="m">${esc(pd.spec)}</div>`;
  if(pd.entrega)body+=`<div class="m">📅 ${esc(fmtData(pd.entrega))}</div>`;
  if(pd.urgente&&pd.status==="aberto")body+=`<div class="m" style="margin-top:4px"><span class="pill crit">URGENTE</span></div>`;
  card.innerHTML=body;
  if(!tv){const act=el("div","act");
    if(isAtender){
      const ac=el("button","btn sm okb");ac.textContent="✓ Aceitar";ac.onclick=()=>patch("pedidos",pd.id,{status:"aceito"});act.appendChild(ac);
      const na=el("button","btn sm danger");na.textContent="✕";na.title="Recusar";na.onclick=()=>confirmar("Recusar o pedido de "+pd.cliente+"?",()=>patch("pedidos",pd.id,{status:"nao"}),"Recusar");act.appendChild(na);
    } else if(isEntregue){
      if(pd.status!=="entregue"){const en=el("button","btn sm okb");en.textContent="✓ Confirmar entrega";en.onclick=()=>patch("pedidos",pd.id,{status:"entregue"});act.appendChild(en);}
      else{const re=el("button","btn sm ghost");re.textContent="↩︎ Reabrir";re.onclick=()=>patch("pedidos",pd.id,{status:"aceito"});act.appendChild(re);}
    } else {
      const st=stApont(pd.produto,col,{pedidoId:pd.id});
      const bc=el("button","btn sm okb");bc.textContent="✓ Concluir etapa ▸";bc.onclick=()=>concluirEtapa(pd.produto,col,{pedidoId:pd.id,lote:pd.cliente});act.appendChild(bc);
      if(st==="afazer"){const bi=el("button","btn sm ghost");bi.style.flex="none";bi.textContent="▶";bi.title="Marcar início agora (cronometrar)";bi.onclick=()=>{iniciarEtapa(pd.produto,col,{pedidoId:pd.id,lote:pd.cliente});toast("Etapa iniciada.");};act.appendChild(bi);}
    }
    const ed=el("button","btn sm ghost");ed.textContent="✏️";ed.title="Editar pedido";ed.onclick=()=>modalPedido(pd);act.appendChild(ed);
    card.appendChild(act);}
  return card;
}

function viewProg(){
  const w=el("div");
  const st=el("div","sec-title");
  st.innerHTML=`<div><h2>Programação de Produção</h2><p>O que produzir para compor estoque (MTS) e atender vendas. O estoque dita o ritmo.</p></div>`;
  const add=el("button","btn primary right");add.innerHTML="+ Item do plano";add.onclick=()=>modalPlano();st.appendChild(add);
  w.appendChild(st);
  // navegador de semanas
  const navRow=el("div","card");navRow.style.cssText="padding:10px 14px;margin-bottom:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap";
  navRow.appendChild(weekNav());
  const hint=el("span","muted");hint.style.cssText="font-size:12px";hint.textContent="Use ‹ › para programar outras semanas (anteriores ou futuras).";
  navRow.appendChild(hint);

  // sub-nav dias
  const sub=el("div","subnav");
  const mkChip=(key,label,badge,isToday)=>{const c=el("button","chip"+(progDia===key?" active":"")+(isToday?" today":""));
    c.innerHTML=label+(badge!=null?` <span class="cbadge">${badge}</span>`:"");c.onclick=()=>{progDia=key;renderView();};return c;};
  sub.appendChild(mkChip("semana","Semana toda",planoSem().filter(p=>somaDias(p.dias)>0).length));
  DIAS.forEach(d=>{const itens=planoSem().filter(p=>Number((p.dias||{})[d.k]||0)>0);const q=itens.reduce((s,p)=>s+Number(p.dias[d.k]||0),0);
    sub.appendChild(mkChip(d.k,d.n,itens.length?fmt(q):"–",d.k===HOJE_K));});

  note.innerHTML="⚙️ O que for programado aqui vira cartões no <b>quadro de Produção</b>, que andam pelas etapas (masseira → modelagem → ultracongelamento). Fase seguinte: o motor de MRP calcula a <b>meta</b> a partir do estoque de segurança e do lote econômico. Por ora a meta e os dias são definidos manualmente e aprovados por você.";
  w.appendChild(note);return w;

function progSemana(){
  const card=el("div","card pad0");const tw=el("div","tw");const tbl=el("table");
  tbl.innerHTML=`<thead><tr><th>Produto</th><th>Categoria</th><th>Destino</th><th class="n">Meta sem.</th><th class="n">Produzido</th><th style="width:130px">Progresso</th><th>Dias</th><th>Obs.</th><th></th></tr></thead>`;
  const tb=el("tbody");
  const itens=planoSem().filter(p=>somaDias(p.dias)>0); // consolidação: só o que foi distribuído por dia, na semana selecionada
  if(!itens.length)tb.innerHTML=`<tr><td colspan="9"><div class="empty">Nenhum produto programado nesta semana. Distribua quantidades pelos dias em “+ Item do plano” (a venda média sozinha não entra aqui).</div></td></tr>`;
  itens.forEach(p=>{const P=prod(p.produto),meta=Number(p.meta||0),real=realizadoProduto(p.produto),pct=meta?Math.min(100,Math.round(real/meta*100)):0;
    const chips=DIAS.filter(d=>Number((p.dias||{})[d.k]||0)>0).map(d=>`<span class="daychip">${d.n} ${fmt(p.dias[d.k])}</span>`).join(" ")||'<span class="muted">—</span>';
    const dest=p.destino==="venda"?'<span class="pill forno">Venda</span>':'<span class="pill estoque">Estoque</span>';
    const tr=el("tr");
    tr.innerHTML=`<td><b>${esc(P.nome)}</b></td><td>${catPill(P.cat)}</td><td>${dest}</td>
      <td class="n">${fmt(meta)} <span class="muted">${esc(P.un)}</span></td><td class="n">${fmt(real)}</td>
      <td><div class="rowflex"><div class="bar" style="flex:1"><i style="width:${pct}%"></i></div><span class="mono" style="font-size:12px">${pct}%</span></div></td>
      <td><div class="daychips">${chips}</div></td><td class="muted">${esc(p.obs||"")}</td>
      <td class="rowflex" style="justify-content:flex-end"><button class="btn sm ghost" data-e="${p.id}">✏️</button><button class="btn sm danger" data-d="${p.id}">✕</button></td>`;
    tr.querySelector("[data-e]").onclick=()=>modalPlano(p);
    tr.querySelector("[data-d]").onclick=()=>confirmar("Remover "+P.nome+" do plano?",()=>del("plano",p.id),"Remover");
    tb.appendChild(tr);});
  tbl.appendChild(tb);tw.appendChild(tbl);card.appendChild(tw);return card;
}
function progDoDia(k){
  const nome=(DIAS.find(d=>d.k===k)||{}).n||k;
  const itens=planoSem().filter(p=>Number((p.dias||{})[k]||0)>0);
  const card=el("div","card pad0");
  card.appendChild(cardH("🗓️","Programação de "+nome+(k===HOJE_K?" · hoje":""),`<span class="right eyebrow">${itens.length} produto(s)</span>`));
  const tw=el("div","tw");const tbl=el("table");
  tbl.innerHTML=`<thead><tr><th>Produto</th><th>Categoria</th><th>Destino</th><th class="n">Qtd do dia</th><th>Etapas (regra)</th><th>Obs.</th><th></th></tr></thead>`;
  const tb=el("tbody");
  if(!itens.length)tb.innerHTML=`<tr><td colspan="7"><div class="empty">Nada programado para ${esc(nome)}.</div></td></tr>`;
  let tot=0;
  itens.forEach(p=>{const P=prod(p.produto),q=Number(p.dias[k]||0);tot+=q;
    const rota=rotaDe(p.produto).map(e=>ETAPA_ICON[e]||"•").join(" ");
    const co=coDe(p.produto).map(c=>`+ ${fmt(c.qtd)} ${esc(prod(c.produto).nome)}`).join(", ");
    const dest=p.destino==="venda"?'<span class="pill forno">Venda</span>':'<span class="pill estoque">Estoque</span>';
    const tr=el("tr");
    tr.innerHTML=`<td><b>${esc(P.nome)}</b>${co?`<div class="muted" style="font-size:12px">co-produção: ${co}</div>`:""}</td>
      <td>${catPill(P.cat)}</td><td>${dest}</td><td class="n">${fmt(q)} <span class="muted">${esc(P.un)}</span></td>
      <td style="font-size:15px" title="${esc(rotaDe(p.produto).join(' → '))}">${rota}</td><td class="muted">${esc(p.obs||"")}</td>
      <td class="rowflex" style="justify-content:flex-end"><button class="btn sm ghost" data-e="${p.id}">✏️</button><button class="btn sm danger" data-d="${p.id}">✕</button></td>`;
    tr.querySelector("[data-e]").onclick=()=>modalPlano(p);
    tr.querySelector("[data-d]").onclick=()=>confirmar("Remover "+P.nome+" do plano?",()=>del("plano",p.id),"Remover");
    tb.appendChild(tr);});
  if(itens.length){const tr=el("tr");tr.innerHTML=`<td colspan="3" style="text-align:right;font-weight:700">Total do dia</td><td class="n" style="font-weight:700">${fmt(tot)}</td><td colspan="3"></td>`;tb.appendChild(tr);}
  tbl.appendChild(tb);tw.appendChild(tbl);card.appendChild(tw);return card;
}
function viewProcesso(scope){
  const wrap=el("div");
  const est=tarefasEstoque(scope);
  const ped=tarefasPedido();
  const all=[...est,...ped];
  const escopoTxt=scope==="semana"?"a semana toda":(DIAS.find(d=>d.k===scope)||{}).n||scope;
  if(!all.length){const c=el("div","card");c.appendChild(el("div","empty",`Nada a produzir para ${esc(escopoTxt)}. Programe quantidades no Plano da semana ou insira pedidos.`));wrap.appendChild(c);return wrap;}
  const stPill=(pr)=>{if(pr.st==="concluido")return `<span class="pill ok">Concluído</span> <span class="mono muted" style="font-size:11px">${fmt(pr.produced)}/${fmt(pr.target)}</span>`;
    if(pr.st==="parcial")return `<span class="pill estoque">Parcial</span> <span class="mono" style="font-size:11px">${fmt(pr.produced)}/${fmt(pr.target)}</span>`;
    if(pr.st==="andamento")return '<span class="pill warn">Em andamento</span>';
    return '<span class="pill mut">A fazer</span>';};
  AREAS.forEach(a=>{
    const linhas=all.filter(t=>t.area===a.id);
    if(!linhas.length)return;
    const nCon=linhas.filter(t=>progressoTarefa(t).st==="concluido").length;
    const faseLbl=a.fase==="estoque"?"Estoque · semanal":"Fila de pedidos";
    const card=el("div","card pad0");card.style.marginBottom="14px";
    card.appendChild(cardH(a.icon,a.nome,`<span class="right eyebrow">${esc(faseLbl)} · ${nCon}/${linhas.length} ok</span>`));
    if(a.fase==="estoque")linhas.sort((x,y)=>(DIAS.findIndex(d=>d.k===x.dia)-DIAS.findIndex(d=>d.k===y.dia))||prod(x.produto).nome.localeCompare(prod(y.produto).nome));
    else linhas.sort((x,y)=>String(x.entrega||"9999").localeCompare(String(y.entrega||"9999"))||String(x.rotulo||"").localeCompare(String(y.rotulo||"")));
    const tw=el("div","tw");const tbl=el("table");
    const colOrigem=a.fase==="pedido"?"<th>Cliente / entrega</th>":"<th>Dia</th>";
    tbl.innerHTML=`<thead><tr><th>Produto</th><th>Etapa</th>${colOrigem}<th class="n">Qtd</th><th>Status</th><th></th></tr></thead>`;
    const tb=el("tbody");
    linhas.forEach(t=>{const P=prod(t.produto),pr=progressoTarefa(t);
      const diaN=(DIAS.find(d=>d.k===t.dia)||{}).n||"—";
      const origem=t.origem==="pedido"
        ?`<b>${esc(t.rotulo||"")}</b>${t.entrega?` <span class="pill forno" title="Data de entrega">📅 ${esc(fmtData(t.entrega))}</span>`:' <span class="pill mut">sem data</span>'}${t.spec?`<div class="muted" style="font-size:12px">${esc(t.spec)}</div>`:""}`
        :`<span class="pill mut">${esc(diaN)}</span>`;
      let acao="";
      if(pr.andamento)acao=`<button class="btn sm okb" data-f="1">Finalizar ▸</button>`;
      else if(pr.st==="concluido")acao=`<button class="btn sm ghost" data-i="1">+ Novo lote</button>`;
      else if(pr.st==="parcial")acao=`<button class="btn sm primary" data-i="1">▶ Completar</button>`;
      else acao=`<button class="btn sm primary" data-i="1">▶ Iniciar</button>`;
      const tr=el("tr");
      tr.innerHTML=`<td><b>${esc(P.nome)}</b></td><td>${ETAPA_ICON[t.etapa]||""} ${esc(t.etapa)}${t.etapa===GARGALO?' <span class="pill accent" style="margin-left:2px">gargalo</span>':""}</td>
        <td>${origem}</td><td class="n">${fmt(t.qtd)} <span class="muted">${esc(P.un)}</span></td>
        <td>${stPill(pr)}</td><td class="rowflex" style="justify-content:flex-end">${acao}</td>`;
      const bi=tr.querySelector("[data-i]"),bf=tr.querySelector("[data-f]");
      const prefill={produto:t.produto,etapa:t.etapa,pedidoId:t.origem==="pedido"?t.refId:null,diaProg:t.origem==="plano"?t.dia:null,lote:t.origem==="pedido"?t.rotulo:""};
      if(bi)bi.onclick=()=>modalApont(prefill);
      if(bf)bf.onclick=()=>{const ap=cache.apont.find(x=>x.produto===t.produto&&x.etapa===t.etapa&&x.status==="andamento"&&(t.origem==="pedido"?x.pedidoId===t.refId:(!x.pedidoId&&x.diaProg===t.dia)));if(ap)modalFinalizar(ap);};
      tb.appendChild(tr);});
    tbl.appendChild(tb);tw.appendChild(tbl);card.appendChild(tw);wrap.appendChild(card);
  });
  return wrap;
}
function modalPlano(p){
  const isNew=!p;p=p||{id:uid(),produto:cache.catalogo[0]?.id,meta:"",destino:"estoque",dias:{},obs:"",sem:SEM};
  const opts=cache.catalogo.map(c=>`<option value="${c.id}" ${c.id===p.produto?"selected":""}>${esc(c.nome)}</option>`).join("");
  const diasInputs=DIAS.map(d=>{const v=Number((p.dias||{})[d.k]||0);return `<div class="d ${v?"on":""}"><span>${d.n}</span><input type="number" inputmode="numeric" min="0" data-dia="${d.k}" value="${v||""}" placeholder="0"></div>`;}).join("");
  openModal(isNew?"Novo item do plano":"Editar item",`
    <div class="form-grid">
      <div class="field" style="grid-column:1/-1"><label>Produto</label><select id="f_prod">${opts}</select></div>
      <div class="field"><label>Meta da semana</label><input id="f_meta" type="number" inputmode="numeric" value="${esc(p.meta)}" placeholder="0">
        <div id="f_metahint" style="font-size:11.5px;color:var(--ink-3);display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:18px"></div></div>
      <div class="field"><label>Produção destinada a</label><select id="f_dest"><option value="estoque" ${p.destino!=="venda"?"selected":""}>Estoque (MTS)</option><option value="venda" ${p.destino==="venda"?"selected":""}>Venda / pedido</option></select></div>
    </div>
    <div class="field" style="margin-top:14px"><label>Dias que serão produzidos e quantidade em cada dia</label>
      <div class="diasgrid" id="f_dias">${diasInputs}</div>
      <div id="f_batches" style="font-size:11.5px;color:var(--ink-3);margin-top:8px;line-height:1.5"></div></div>
    <div class="field" style="margin-top:12px"><label>Observação</label><input id="f_obs" value="${esc(p.obs||"")}" placeholder="opcional"></div>
  `,()=>{
    const pid=$("#f_prod").value;
    const dias={};$("#f_dias").querySelectorAll("input[data-dia]").forEach(i=>{const v=Number(i.value||0);if(v>0)dias[i.dataset.dia]=v;});
    const meta=Number($("#f_meta").value||0);
    if(!meta){toast("Informe a meta da semana.");return false;}
    if(!Object.keys(dias).length){toast("Informe ao menos um dia com quantidade.");return false;}
    // upsert por produto: evita duplicar quando o produto já tem item no plano (ex.: veio da venda média)
    const existing=cache.plano.find(x=>x.produto===pid&&x.id!==p.id&&(x.sem||SEM0)===SEM);
    const targetId=existing?existing.id:p.id;
    put("plano",targetId,{id:targetId,produto:pid,meta,destino:$("#f_dest").value,dias,obs:$("#f_obs").value.trim(),sem:SEM});
  });
  // sugestão de batidas de massa (lotes padrão) por dia, a partir da quantidade de cada dia
  const fbatch=$("#f_batches");
  function refreshBatches(){
    if(!fbatch)return;
    const pid=$("#f_prod").value;
    const temLotes=((cfgOf(pid)||{}).loteMassas||[]).some(x=>Number(x.qtd||0)>0);
    if(!temLotes){fbatch.innerHTML=`<span style="opacity:.75">Sem lotes padrão de massa cadastrados para este produto (configure em Métricas).</span>`;return;}
    const linhas=[];let totalBat=0;
    DIAS.forEach(d=>{
      const q=Number(($("#f_dias").querySelector(`input[data-dia="${d.k}"]`)||{}).value||0);
      if(q<=0)return;
      const res=sugerirBatches(pid,q);
      if(!res)return;
      totalBat+=res.itens.reduce((s,i)=>s+i.n,0);
      const extra=res.total!==q?` <span style="color:var(--warn,#b45309)">(bate ${fmt(res.total)} p/ meta ${fmt(q)})</span>`:"";
      linhas.push(`<div><b>${d.n}:</b> ${fmtBatches(res)}${extra}</div>`);
    });
    fbatch.innerHTML=linhas.length
      ? `<div style="font-weight:600;color:var(--ink-2);margin-bottom:2px">🥖 Batidas de massa sugeridas (${totalBat} batida${totalBat!==1?"s":""} na semana)</div>`+linhas.join("")
      : `<span style="opacity:.75">Informe a quantidade de cada dia para ver as batidas sugeridas.</span>`;
  }
  // realce dos dias marcados
  $("#f_dias").addEventListener("input",e=>{const d=e.target.closest(".d");if(d)d.classList.toggle("on",Number(e.target.value||0)>0);refreshBatches();});
  // sugestão de meta a partir da venda média (referência), descontando o que já está programado
  const fmeta=$("#f_meta"),fhint=$("#f_metahint"),fprod=$("#f_prod");
  function refreshHint(preencher){const pid=fprod.value,vms=vmsDe(pid);
    const jaProg=planoSem().filter(x=>x.produto===pid&&x.id!==p.id).reduce((s,x)=>s+somaDias(x.dias),0);
    const sug=Math.max(0,vms-jaProg);
    if(vms>0){
      fhint.innerHTML=(jaProg>0
        ? `Venda média ${fmt(vms)} · já programado ${fmt(jaProg)} · <b>faltam ${fmt(sug)}</b> `
        : `Venda média (sugestão): <b>${fmt(vms)}</b> `)+`<button type="button" class="btn sm ghost" id="f_usesug" style="padding:2px 8px">usar</button>`;
      const b=fhint.querySelector("#f_usesug");if(b)b.onclick=()=>{fmeta.value=(sug||vms);};
      if(preencher&&!Number(fmeta.value||0))fmeta.value=(sug||vms);
    } else { fhint.textContent="Sem venda média cadastrada — informe a meta manualmente."; }
  }
  fprod.addEventListener("change",()=>{refreshHint(true);refreshBatches();});
  refreshHint(isNew);
  refreshBatches();
}

function viewApont(){
  const w=el("div");
  const st=el("div","sec-title");
  st.innerHTML=`<div><h2>Apontamento de etapas</h2><p>Desdobrado por área de processo a partir da programação e dos pedidos. Registre início, produção e perdas.</p></div>`;
  const add=el("button","btn primary right");add.innerHTML="+ Iniciar etapa avulsa";add.onclick=()=>modalApont();st.appendChild(add);w.appendChild(st);
  // Desdobramento por processo — só aparece quando há PROGRAMAÇÃO (distribuída na semana) ou PEDIDO
  if(tarefasEstoque("semana").length || tarefasPedido().length){
    const hd=el("div");hd.style.margin="2px 0 12px";
    hd.innerHTML=`<div class="eyebrow">Desdobramento da semana</div><div class="muted" style="font-size:12.5px;margin-top:2px">Fase estoque (massa → modelagem → ultracongelamento) vem da programação distribuída por dia; fase sob pedido (fermentação → assamento → embalagem → separação) vem dos pedidos abertos.</div>`;
    w.appendChild(hd);
    w.appendChild(viewProcesso("semana"));
  } else {
    const info=el("div","card");info.appendChild(el("div","empty","Nenhum apontamento a fazer. Eles aparecem quando você programa a produção (aba Programação de Produção, distribuindo as quantidades pelos dias) ou quando entra um pedido de cliente."));
    w.appendChild(info);
  }

  cmp.appendChild(cnote);

  const tw=el("div","tw");const tbl=el("table");

  const tb=el("tbody");const maxP=Math.max(1,...M.map(m=>m.pct));

function cfgEditor(pid){

      d.querySelector("input").oninput=ev=>{const v=Number(ev.target.value||0);if(v>0)tempos[e]=v;else delete tempos[e];d.classList.toggle("on",v>0);};
      g.appendChild(d);});

    r.querySelectorAll("[data-f]").forEach(inp=>inp.onchange=()=>{co[idx][inp.dataset.f]=inp.dataset.f==="qtd"?Number(inp.value||0):inp.value;});
    r.querySelector("[data-rm]").onclick=()=>{co.splice(idx,1);drawCo();};coBox.appendChild(r);});}

  scrim.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="modal-h"><h3>${esc(title)}</h3><button class="iconbtn right" id="m_x" aria-label="Fechar">✕</button></div><div class="modal-b">${bodyHTML}</div><div class="modal-f"><button class="btn ghost" id="m_cancel">Cancelar</button><button class="btn primary right" id="m_ok">${esc(saveLabel||"Salvar")}</button></div></div>`;
  const close=()=>host.innerHTML="";host.innerHTML="";host.appendChild(scrim);
  scrim.querySelector("#m_x").onclick=close;scrim.querySelector("#m_cancel").onclick=close;scrim.onclick=e=>{if(e.target===scrim)close();};
  scrim.querySelector("#m_ok").onclick=async()=>{let r;try{r=await onSave();}catch(err){toast("Erro: "+(err&&err.message||err));return;}if(r!==false)close();};
  const f=scrim.querySelector("input,select,textarea");if(f)setTimeout(()=>f.focus(),40);
}
function applyTheme(t){if(t)document.documentElement.setAttribute("data-theme",t);saveLS("pcp_theme",t||"");}
(function(){const t=loadLS("pcp_theme","");if(t)document.documentElement.setAttribute("data-theme",t);})();
$("#themeBtn").onclick=()=>{const cur=document.documentElement.getAttribute("data-theme");const dark=cur?cur==="dark":matchMedia("(prefers-color-scheme:dark)").matches;applyTheme(dark?"light":"dark");};
$("#tvExit").onclick=exitTV;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&document.body.classList.contains("tv"))exitTV();});
(function(){const bs=$("#brandsub");if(bs)bs.textContent="PCP · Chão de fábrica · "+VER;})();
function bootApp(){renderPerfil();renderTabs();renderBanner();renderView();initDB();}
function aplicarPerfilDoLogin(){if(usuarioLogado){const pf=PERFIS.find(p=>p.id===usuarioLogado);if(pf){perfil=usuarioLogado;saveLS("pcp_perfil",perfil);tab=pf.tab;}}}
function mostrarApp(){const ls=document.getElementById("login-screen");if(ls)ls.style.display="none";aplicarPerfilDoLogin();bootApp();}
window.entrar=function(){
  const u=(document.getElementById("l-user").value||"").trim().toLowerCase();
  const p=document.getElementById("l-pass").value||"";
  const err=document.getElementById("login-error");err.textContent="";
  if(!u||!p){err.textContent="Preencha usuário e senha.";return;}
  if(USUARIOS_VALIDOS.indexOf(u)===-1){err.textContent="Usuário não encontrado.";return;}
  const btn=document.getElementById("login-btn");btn.disabled=true;btn.textContent="Entrando…";
  FS.collection("usuarios").doc(u).get().then(doc=>{
    let hash;
    if(!doc.exists){hash=hashSimples(u);FS.collection("usuarios").doc(u).set({senhaHash:hash,nome:u,criadoEm:firebase.firestore.FieldValue.serverTimestamp()});}
    else hash=doc.data().senhaHash;
    if(hashSimples(p)===hash){usuarioLogado=u;sessionStorage.setItem("pcp_user",u);mostrarApp();}
    else{err.textContent="Senha incorreta.";btn.disabled=false;btn.textContent="Entrar";}
  }).catch(e=>{err.textContent="Erro de conexão: "+e.message;btn.disabled=false;btn.textContent="Entrar";});
};
window.sairConta=function(){confirmar("Deseja sair da conta?",()=>{sessionStorage.removeItem("pcp_user");location.reload();},"Sair");};
window.trocarSenha=function(){
  if(!usuarioLogado){toast("Entre na conta primeiro.");return;}
  openModal("Trocar senha",`
    <div class="field"><label>Senha atual</label><input id="ts_atual" type="password"></div>
    <div class="field" style="margin-top:10px"><label>Nova senha</label><input id="ts_nova" type="password"></div>
    <div class="field" style="margin-top:10px"><label>Confirmar nova senha</label><input id="ts_conf" type="password"></div>`,
  async()=>{
    const a=$("#ts_atual").value,n=$("#ts_nova").value,c=$("#ts_conf").value;
    if(!a||!n||!c){toast("Preencha todos os campos.");return false;}
    if(n!==c){toast("Nova senha e confirmação não coincidem.");return false;}
    if(n.length<3){toast("A senha deve ter ao menos 3 caracteres.");return false;}
    const doc=await FS.collection("usuarios").doc(usuarioLogado).get();
    const atualHash=doc.exists?doc.data().senhaHash:hashSimples(usuarioLogado);
    if(hashSimples(a)!==atualHash){toast("Senha atual incorreta.");return false;}
    await FS.collection("usuarios").doc(usuarioLogado).update({senhaHash:hashSimples(n)});
    toast("Senha alterada com sucesso.");
  });
};
(function(){const u=sessionStorage.getItem("pcp_user");if(u&&USUARIOS_VALIDOS.indexOf(u)!==-1){usuarioLogado=u;mostrarApp();}})();
setInterval(()=>{const txt=new Date().toLocaleString("pt-BR",{weekday:"short",hour:"2-digit",minute:"2-digit"});document.querySelectorAll("#clock").forEach(x=>x.textContent=txt);},30000);
</script>
